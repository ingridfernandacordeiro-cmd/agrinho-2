<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Imagens em HTML</title>
</head>
<body>

    <h1>Exemplos de Uso da Tag Img</h1>
    <hr>

    <h2>1. Imagem Básica</h2>
    <img src="caminho_da_imagem.jpg" alt="Descrição da imagem para acessibilidade">

    <h2>2. Imagem com Tamanho Definido</h2>
    <img src="foto.jpg" alt="Uma foto bonita" width="500">

    <h2>3. Imagem Clicável (Link)</h2>
    <a href="https://www.exemplo.com" target="_blank">
        <img src="botao.png" alt="Clique aqui para acessar o site">
    </a>

    <h2>4. Imagem de URL Externa</h2>
    <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba" alt="Um gato fofo" width="300">

</body>
</html>
