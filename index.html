<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia Interativa Completa</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: #333;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #34495e;
            font-size: 1.4rem;
        }
        /* Estilo da Imagem */
        .midia-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .midia-img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        /* Estilo do Vídeo e Controles */
        .video-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        video {
            max-width: 100%;
            border-radius: 8px;
            display: block;
        }
        .controles {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.ativo {
            background-color: #e74c3c;
        }
        button.ativo:hover {
            background-color: #c0392b;
        }
        .status-txt {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #7f8c8d;
            height: 20px;
        }
    </style>
</head>
<body>

    <h1>Painel de Controle de Mídia</h1>

    <div class="container">

        <div class="card">
            <h2>Galeria Dinâmica (Clique na Imagem)</h2>
            <img id="galeria" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba" alt="Gatinho fofo" class="midia-img">
            <p id="legendaImg" class="status-txt">Clique para mudar a foto</p>
        </div>

        <div class="card">
            <h2>Player de Vídeo Customizado</h2>
            <div class="video-container">
                <video id="playerVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" loop></video>
            </div>
            <div class="controles">
                <button id="btnPlay">Play ▶</button>
                <button id="btnMute">Mutar 🔇</button>
            </div>
            <p id="statusVideo" class="status-txt">Vídeo pausado</p>
        </div>

    </div>

    <script>
        // --- GERENCIAMENTO DA IMAGEM ---
        const imgElemento = document.getElementById('galeria');
        const legendaImg = document.getElementById('legendaImg');
        
        // Lista de imagens para alternar no clique
        const listaImagens = [
            "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba", // Gato
            "https://images.unsplash.com/photo-1543466835-00a7907e9de1"  // Cachorro
        ];
        let indiceAtual = 0;

        imgElemento.addEventListener('click', () => {
            // Alterna o índice entre 0 e 1
            indiceAtual = indiceAtual === 0 ? 1 : 0;
            imgElemento.src = listaImagens[indiceAtual];
            
            // Atualiza o texto descritivo
            if (indiceAtual === 0) {
                imgElemento.alt = "Gatinho fofo";
                legendaImg.innerText = "Você voltou para o gatinho! 🐱";
            } else {
                imgElemento.alt = "Cachorrinho feliz";
                legendaImg.innerText = "Você mudou para o cachorrinho! 🐶";
            }
        });

        // --- GERENCIAMENTO DO VÍDEO ---
        const video = document.getElementById('playerVideo');
        const btnPlay = document.getElementById('btnPlay');
        const btnMute = document.getElementById('btnMute');
        const statusVideo = document.getElementById('statusVideo');

        // Função de Play / Pause
        btnPlay.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btnPlay.innerText = "Pause ⏸";
                btnPlay.classList.add('ativo');
                statusVideo.innerText = "Reproduzindo vídeo...";
                statusVideo.style.color = "#2ecc71";
            } else {
                video.pause();
                btnPlay.innerText = "Play ▶";
                btnPlay.classList.remove('ativo');
                statusVideo.innerText = "Vídeo pausado";
                statusVideo.style.color = "#7f8c8d";
            }
        });

        // Função de Mute / Unmute
        btnMute.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                btnMute.innerText = "Mutar 🔇";
                btnMute.classList.remove('ativo');
            } else {
                video.muted = true;
                btnMute.innerText = "Tirar Mute 🔊";
                btnMute.classList.add('ativo');
            }
        });
    </script>

</body>
</html>
