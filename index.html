<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Galeria de Mídias Interativas</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 30px;
            color: #1a252f;
            text-align: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }
        .card {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        /* Estilo Avançado da Imagem */
        .midia-img {
            max-width: 100%;
            height: 300px;
            object-fit: cover; /* Garante que a foto não fique distorcida */
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .midia-img:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        /* Estilo do Vídeo */
        video {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: block;
            margin: 0 auto;
        }
        /* Área de Botões e Status */
        .controles {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        button.ativo {
            background-color: #e74c3c;
        }
        button.ativo:hover {
            background-color: #c0392b;
        }
        .status-txt {
            margin-top: 15px;
            font-size: 15px;
            font-weight: 500;
            color: #7f8c8d;
            height: 20px;
        }
    </style>
</head>
<body>

    <h1>Painel de Mídias Completo</h1>

    <div class="container">

        <div class="card">
            <h2>Galeria de Fotos Dinâmica</h2>
            
            <img id="galeria" 
                 src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba" 
                 alt="Um gatinho cinza olhando de lado" 
                 title="Passe o mouse para ver e clique para mudar!"
                 loading="lazy"
                 class="midia-img">
                 
            <p id="legendaImg" class="status-txt">Dica: Clique em cima da foto para alternar</p>
        </div>

        <div class="card">
            <h2>Player de Vídeo Customizado</h2>
            
            <div class="video-container">
                <video id="playerVideo" src="https://www.w3schools.com/html/mov_bbb.mp4" loop poster="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=500"></video>
            </div>
            
            <div class="controles">
                <button id="btnPlay">Play ▶</button>
                <button id="btnMute">Mutar 🔇</button>
            </div>
            
            <p id="statusVideo" class="status-txt">Vídeo pausado</p>
        </div>

    </div>

    <script>
        // --- CÓDIGO DA IMAGEM DENTRO DO SCRIPT ---
        const imgElemento = document.getElementById('galeria');
        const legendaImg = document.getElementById('legendaImg');
        
        // Array com links de fotos diferentes na internet
        const listaImagens = [
            "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba", // Gato
            "https://images.unsplash.com/photo-1543466835-00a7907e9de1"  // Cachorro
        ];
        let indiceAtual = 0;

        // Troca de imagem e altera os textos de acessibilidade dinamicamente
        imgElemento.addEventListener('click', () => {
            indiceAtual = indiceAtual === 0 ? 1 : 0;
            imgElemento.src = listaImagens[indiceAtual];
            
            if (indiceAtual === 0) {
                imgElemento.alt = "Um gatinho cinza olhando de lado";
                imgElemento.title = "Esse é o gatinho!";
                legendaImg.innerText = "Você voltou para o gatinho! 🐱";
                legendaImg.style.color = "#2c3e50";
            } else {
                imgElemento.alt = "Um cachorrinho da raça beagle correndo na grama";
                imgElemento.title = "Esse é o cachorrinho!";
                legendaImg.innerText = "Você mudou para o cachorrinho! 🐶";
                legendaImg.style.color = "#e67e22";
            }
        });


        // --- CÓDIGO DO VÍDEO DENTRO DO SCRIPT ---
        const video = document.getElementById('playerVideo');
        const btnPlay = document.getElementById('btnPlay');
        const btnMute = document.getElementById('btnMute');
        const statusVideo = document.getElementById('statusVideo');

        // Controla o Play e o Pause e muda os estilos do botão
        btnPlay.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btnPlay.innerText = "Pause ⏸";
                btnPlay.classList.add('ativo');
                statusVideo.innerText = "Reproduzindo vídeo...";
                statusVideo.style.color = "#2ecc71";
            } else {
                video.pause();
                btnPlay.innerText = "Play ▶";
                btnPlay.classList.remove('ativo');
                statusVideo.innerText = "Vídeo pausado";
                statusVideo.style.color = "#7f8c8d";
            }
        });

        // Controla o áudio do vídeo (Mute / Unmute)
        btnMute.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                btnMute.innerText = "Mutar 🔇";
                btnMute.classList.remove('ativo');
            } else {
                video.muted = true;
                btnMute.innerText = "Tirar Mute 🔊";
                btnMute.classList.add('ativo');
            }
        });
    </script>

</body>
</html>
